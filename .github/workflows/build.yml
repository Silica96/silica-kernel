name: build-kernel

on:
  workflow_dispatch:
    inputs:
      update:
        description: "빌드 전에 nix-cachyos-kernel 을 최신 release 로 갱신"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, .github/workflows/build.yml]
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST: 새 커널이 나왔는지 확인

permissions:
  contents: write # 갱신된 flake.lock 커밋용

concurrency:
  group: build-kernel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub 호스트 러너의 작업당 최대 6시간
    env:
      # 둘 다 설정돼 있을 때만 캐시에 올린다 (Settings → Secrets and variables → Actions)
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: 디스크 확보
        run: |
          echo "::group::정리 전"; df -h; echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null || true
          echo "::group::정리 후"; df -h; echo "::endgroup::"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            cores = 0
            max-jobs = auto

      - name: 빌드 임시 디렉터리를 여유 있는 디스크로
        run: |
          # 러너에는 / 외에 /mnt 임시 디스크가 따로 붙어 있는 경우가 많다
          if mountpoint -q /mnt && [ "$(df --output=avail -B1G /mnt | tail -1)" -gt "$(df --output=avail -B1G / | tail -1)" ]; then
            sudo mkdir -p /mnt/nix-build && sudo chmod 1777 /mnt/nix-build
            sudo mkdir -p /etc/systemd/system/nix-daemon.service.d
            printf '[Service]\nEnvironment=TMPDIR=/mnt/nix-build\n' | sudo tee /etc/systemd/system/nix-daemon.service.d/tmpdir.conf
            sudo systemctl daemon-reload
            sudo systemctl restart nix-daemon
            echo "빌드 디렉터리: /mnt/nix-build"
          else
            echo "빌드 디렉터리: /tmp (기본)"
          fi

      - uses: cachix/cachix-action@v16
        if: env.CACHIX_CACHE != '' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: 상위 flake 갱신
        id: update
        if: github.event_name == 'schedule' || inputs.update
        run: |
          nix flake update nix-cachyos-kernel
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "- 상위 flake 변경 없음" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff flake.lock
          fi

      # flake.lock 이 그대로여도 캐시가 비었거나 정리됐을 수 있으므로, 결과물 존재 여부로 판단한다
      - name: 캐시에 이미 있는지 확인
        id: cache
        run: |
          # shellcheck disable=SC2016 # 작은따옴표 안은 셸이 아닌 Nix 식
          paths=$(nix eval --raw --apply 'p: builtins.concatStringsSep " " ((map (o: p.kernel.${o}.outPath) p.kernel.outputs) ++ [ p.nvidia-open.outPath ])' .#packages.x86_64-linux)
          echo "$paths" | tr ' ' '\n'
          # shellcheck disable=SC2086
          if [ -n "$CACHIX_CACHE" ] && nix path-info --store "https://$CACHIX_CACHE.cachix.org" $paths > /dev/null 2>&1; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "- 결과물이 이미 캐시에 있음: 빌드를 건너뜀" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 커널 + NVIDIA open 모듈 빌드
        if: steps.cache.outputs.cached != 'true'
        run: |
          # 5분마다 디스크 사용량 기록 (최대치를 보려고)
          ( while true; do date +%T; df -B1G --output=target,used,avail / /mnt 2>/dev/null | tail -n +2; sleep 300; done ) > disk.log &

          set +e
          start=$(date +%s)
          nix build -L --no-link --print-out-paths '.#kernel^*' .#nvidia-open | tee out-paths.txt
          status=${PIPESTATUS[0]}
          end=$(date +%s)

          {
            echo "## 빌드 결과: $([ "$status" -eq 0 ] && echo 성공 || echo "실패 (exit $status)")"
            echo "- 소요 시간: $(( (end - start) / 60 ))분"
            echo "- 결과물:"; echo '```'; cat out-paths.txt; echo '```'
            echo "- 디스크 사용량 (5분 간격, GB):"; echo '```'; cat disk.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: 갱신된 flake.lock 커밋
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "flake.lock: nix-cachyos-kernel 갱신"
          git push
